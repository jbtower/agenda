<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <title>Agenda Digital</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button id="btnPrev" class="icon" aria-label="Día anterior">‹</button>
    <button id="btnTitulo" class="titulo" aria-label="Abrir calendario">
      <span id="tituloDia"></span>
      <span id="subtituloDia"></span>
    </button>
    <button id="btnNext" class="icon" aria-label="Día siguiente">›</button>
  </header>

  <nav class="barra">
    <button id="btnHoy">Hoy</button>
    <span id="estado" class="estado" title="Estado de sincronización"></span>
    <button id="btnSync" class="icon sm" aria-label="Sincronizar ahora">⟳</button>
    <button id="btnConfig" class="icon sm" aria-label="Configuración">⚙</button>
  </nav>

  <section id="calendario" class="calendario" hidden>
    <div class="cal-head">
      <button id="calPrev" class="icon sm" aria-label="Mes anterior">‹</button>
      <span id="calTitulo"></span>
      <button id="calNext" class="icon sm" aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <main>
    <details id="devo" class="bloque devo" hidden></details>

    <section class="bloque">
      <h2>Nota del día</h2>
      <textarea id="nota" rows="3" placeholder="Escribí lo que quieras para este día…"></textarea>
    </section>

    <section class="bloque">
      <h2>Actividades <span id="contador"></span></h2>
      <div id="periodos"></div>
    </section>
  </main>

  <form id="formNuevo" class="nuevo" autocomplete="off">
    <div class="fila1">
      <input id="nuevoTexto" type="text" placeholder="Nueva actividad" aria-label="Actividad" required>
      <button type="submit" class="primario" aria-label="Agregar">＋</button>
    </div>
    <div class="fila2">
      <input id="nuevoHora" type="time" aria-label="Hora (opcional)">
      <select id="nuevoPeriodo" aria-label="Período"></select>
      <select id="nuevoAviso" aria-label="Aviso" disabled></select>
    </div>
  </form>

  <dialog id="dlgItem">
    <form method="dialog" id="formItem">
      <h3>Editar actividad</h3>
      <label>Actividad<textarea id="itTexto" rows="3" required></textarea></label>
      <div class="fila">
        <label>Hora<input id="itHora" type="time"></label>
        <label>Aviso<select id="itAviso"></select></label>
      </div>
      <div class="fila">
        <label>Período<select id="itPeriodo"></select></label>
        <label>Fecha<input id="itFecha" type="date" required></label>
      </div>
      <label class="check"><input id="itHecho" type="checkbox"> Hecho</label>
      <div class="acciones">
        <button type="button" id="itBorrar" class="peligro">Eliminar</button>
        <span class="sep"></span>
        <button value="cancel" formnovalidate>Cancelar</button>
        <button type="submit" value="ok" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgConfig">
    <form method="dialog" id="formConfig">
      <h3>Configuración</h3>
      <label>URL de la aplicación web (Apps Script)
        <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <label>Clave API
        <input id="cfgKey" type="password" autocomplete="off">
      </label>
      <p id="cfgMsg" class="msg"></p>
      <div class="acciones col">
        <button type="button" id="cfgProbar">Probar conexión</button>
        <button type="button" id="cfgTelegram">Enviar prueba a Telegram</button>
        <button type="button" id="cfgCompleta">Descargar todo desde Drive</button>
        <button type="button" id="cfgExportar">Exportar copia (JSON)</button>
      </div>
      <div class="acciones">
        <span class="sep"></span>
        <button value="cancel" formnovalidate>Cerrar</button>
        <button type="submit" value="ok" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
